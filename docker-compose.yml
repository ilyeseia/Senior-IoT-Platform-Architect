# Grows phase by phase — Phase 5 only needs Postgres+TimescaleDB for
# development/testing. Phase 8 adds redis; Phase 13 finalizes backend/
# frontend/nginx into a full deployable stack. Not doing all of that now
# would be building ahead of the phase that needs it.
services:
  postgres:
    # Pinned (was :latest-pg16): an unpinned tag can change the TimescaleDB/Postgres minor version under an
    # existing volume on the next `docker compose pull`. Bump deliberately, after reading the release notes.
    image: timescale/timescaledb:2.30.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: esp_claw
      POSTGRES_PASSWORD: esp_claw_dev_only
      POSTGRES_DB: esp_claw_platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esp_claw -d esp_claw_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
